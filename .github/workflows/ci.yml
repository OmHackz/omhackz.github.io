name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS syntax check
        run: |
          set -e
          for f in script.js downloads.js projects.js assets/js/*.js scripts/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
            echo "OK $f"
          done
