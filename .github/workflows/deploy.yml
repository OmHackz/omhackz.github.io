name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject Supabase envs from repo secrets into the client config.
      # GitHub Pages is static — secrets are baked in at deploy time,
      # never exposed to the Actions log or the git history.
      - name: Inject OmAccount config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OM_OWNER_GITHUB: ${{ secrets.OM_OWNER_GITHUB }}
          OM_OWNER_EMAIL: ${{ secrets.OM_OWNER_EMAIL }}
        run: node scripts/write-omaccount-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Drop git metadata
        run: rm -rf .git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
