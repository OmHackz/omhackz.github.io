<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmHackz Downloads — Data Editor</title>
<style>
  :root{
    --bg:#f6f6f6;--panel:#fff;--text:#111;--muted:#737373;--line:#e7e7e7;
    --accent:#111;--danger:#d92d20;--ok:#16803c;--shadow:0 10px 30px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:1200px;margin:auto;padding:28px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
  h1{margin:0;font-size:26px;letter-spacing:-.7px}
  .sub{margin:5px 0 0;color:var(--muted);font-size:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:10px;font-weight:650}
  .btn.primary{background:#111;color:#fff;border-color:#111}
  .btn.danger{color:var(--danger)}
  .status{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:11px;margin-bottom:18px;font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:#aaa}
  .dot.ok{background:var(--ok)}
  .dot.bad{background:var(--danger)}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .list-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .list-head strong{font-size:14px}
  .count{font-size:12px;color:var(--muted)}
  .search{margin:12px}
  input,textarea,select{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px 11px;outline:none;background:#fff}
  input:focus,textarea:focus,select:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  textarea{resize:vertical;min-height:110px}
  .items{max-height:calc(100vh - 250px);overflow:auto;padding:6px}
  .item{width:100%;text-align:left;background:#fff;border:0;border-radius:10px;padding:12px;margin-bottom:3px}
  .item:hover,.item.active{background:#f3f3f3}
  .item-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:7px}
  .editor{padding:22px}
  .editor-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  .editor-title{font-size:18px;font-weight:750}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:12px;font-weight:700;color:#444}
  .req{color:#c00}
  .check{display:flex;align-items:center;gap:8px;height:42px}
  .check input{width:auto}
  .hint{font-size:11px;color:var(--muted)}
  .invalid{border-color:#e5484d!important;background:#fff8f8}
  .error{color:var(--danger);font-size:12px;margin-top:12px;white-space:pre-wrap}
  .empty{padding:35px 18px;text-align:center;color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .raw{margin-top:18px}
  .raw summary{cursor:pointer;color:#555;font-size:13px}
  .raw textarea{margin-top:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
  .toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
  .toast.show{opacity:1;transform:none}
  @media(max-width:800px){.layout{grid-template-columns:1fr}.items{max-height:300px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}header{flex-direction:column}.actions{width:100%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>OmHackz Downloads Data Editor</h1>
      <p class="sub">Visual editor for the n:point downloads feed.</p>
    </div>
    <div class="actions">
      <button class="btn" id="reloadBtn">Reload n:point</button>
      <button class="btn" id="importBtn">Import JSON</button>
      <button class="btn primary" id="exportBtn">Copy JSON</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="status" id="status">
    <span class="dot"></span><span>Loading existing data…</span>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="list-head">
        <strong>Downloads</strong>
        <span class="count" id="count">0 items</span>
      </div>
      <div class="search"><input id="search" placeholder="Search downloads…"></div>
      <div class="items" id="items"></div>
      <div style="padding:10px;border-top:1px solid var(--line)">
        <button class="btn primary" style="width:100%" id="newBtn">+ New download</button>
      </div>
    </section>

    <section class="panel editor">
      <div class="editor-top">
        <div class="editor-title" id="editorTitle">Select a download</div>
        <button class="btn danger" id="deleteBtn" hidden>Delete</button>
      </div>

      <div id="formArea">
        <div class="empty">Choose an item from the left, or create a new download.</div>
      </div>

      <details class="raw">
        <summary>Raw JSON preview</summary>
        <textarea id="rawJson" rows="18" spellcheck="false"></textarea>
        <div class="toolbar">
          <button class="btn" id="applyRawBtn">Apply JSON</button>
          <button class="btn" id="downloadBtn">Download JSON file</button>
        </div>
      </details>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ENDPOINT = "https://api.npoint.io/afd57df48806930591b9";
const TYPES = ["minecraft","app","apk","exe","script","other"];

let items = [];
let selected = -1;
let sourceShape = "array";
let sourceWrapper = null;

const $ = id => document.getElementById(id);

function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 1800);
}

function setStatus(text, kind=""){
  $("status").innerHTML = `<span class="dot ${kind}"></span><span>${text}</span>`;
}

function normalizeResponse(data){
  // Bare array
  if(Array.isArray(data)){
    return {items:data, shape:"array", wrapper:null};
  }
  // {items:[...]}
  if(data && Array.isArray(data.items)){
    return {items:data.items, shape:"items", wrapper:data};
  }
  // {downloads:[...]}
  if(data && Array.isArray(data.downloads)){
    return {items:data.downloads, shape:"downloads", wrapper:data};
  }
  // If the endpoint currently contains the supplied schema, don't treat it as a download.
  if(data && data.definitions && data.definitions.item){
    return {items:[], shape:"array", wrapper:null, schemaOnly:true};
  }
  throw new Error("The endpoint is neither a download array nor an object containing items/downloads.");
}

async function load(){
  setStatus("Fetching current n:point data…");
  try{
    const res = await fetch(ENDPOINT, {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const normalized = normalizeResponse(data);
    items = normalized.items.map(x => ({...x}));
    sourceShape = normalized.shape;
    sourceWrapper = normalized.wrapper;
    selected = -1;
    renderList();
    renderEditor();
    updateRaw();
    if(normalized.schemaOnly){
      setStatus("Endpoint contains the schema, not download items. Editor started with 0 items.", "bad");
    }else{
      setStatus(`Loaded ${items.length} download${items.length===1?"":"s"} from n:point.`, "ok");
    }
  }catch(err){
    setStatus(`Could not load endpoint: ${err.message}. You can still import JSON manually.`, "bad");
  }
}

function validItem(x, all=items){
  const errors=[];
  if(!/^[a-z0-9][a-z0-9-]*$/.test(x.id||"")) errors.push("ID must match ^[a-z0-9][a-z0-9-]*$.");
  if(!x.name) errors.push("Name is required.");
  if(!TYPES.includes(x.type)) errors.push("Type is invalid.");
  if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(x.updated||"")) errors.push("Updated must be YYYY-MM-DD.");
  if(!/^https?:\\/\\//i.test(x.url||"")) errors.push("URL must use http:// or https://.");
  if(x.downloads != null && (!Number.isInteger(x.downloads) || x.downloads < 0)) errors.push("Downloads must be a non-negative integer.");
  if(x.screenshots && !Array.isArray(x.screenshots)) errors.push("Screenshots must be an array.");
  const duplicate=all.some((it,i)=>i!==selected && it.id===x.id);
  if(duplicate) errors.push("ID must be unique.");
  return errors;
}

function renderList(){
  const q=$("search").value.toLowerCase().trim();
  const box=$("items");
  const filtered=items.map((x,i)=>({x,i})).filter(({x}) =>
    !q || [x.name,x.id,x.type,x.tagline].join(" ").toLowerCase().includes(q)
  );
  $("count").textContent=`${items.length} item${items.length===1?"":"s"}`;
  if(!filtered.length){
    box.innerHTML='<div class="empty">'+(items.length?'No matching downloads.':'No downloads yet.')+'</div>';
    return;
  }
  box.innerHTML=filtered.map(({x,i})=>`
    <button class="item ${i===selected?'active':''}" data-index="${i}">
      <div class="item-title">${escapeHtml(x.name || "(untitled)")}</div>
      <div class="item-meta"><span>${escapeHtml(x.type||"other")}</span><span>•</span><span>${escapeHtml(x.version||"no version")}</span></div>
    </button>
  `).join("");
  box.querySelectorAll(".item").forEach(b=>b.onclick=()=>{selected=+b.dataset.index;renderList();renderEditor()});
}

function renderEditor(){
  const area=$("formArea");
  if(selected<0 || !items[selected]){
    $("editorTitle").textContent="Select a download";
    $("deleteBtn").hidden=true;
    area.innerHTML='<div class="empty">Choose an item from the left, or create a new download.</div>';
    return;
  }
  const x=items[selected];
  $("editorTitle").textContent=x.name || "Edit download";
  $("deleteBtn").hidden=false;
  area.innerHTML=`
    <div class="grid">
      ${field("id","ID *",x.id,"URL-safe slug, e.g. nanomenu-v2")}
      ${field("name","Name *",x.name,"Display name")}
      <div class="field"><label>Type <span class="req">*</span></label>
        <select id="f-type">${TYPES.map(t=>`<option ${x.type===t?"selected":""}>${t}</option>`).join("")}</select>
      </div>
      ${field("version","Version",x.version,"e.g. 2.4.0")}
      ${field("updated","Updated *",x.updated,"YYYY-MM-DD","date")}
      ${field("file","Filename",x.file,"e.g. nanomenu-2.4.jar")}
      ${field("size","Size",x.size,"e.g. 184 KB")}
      ${field("url","Download URL *",x.url,"https://…")}
      ${field("tagline","Tagline",x.tagline,"One-line summary")}
      <div class="field"><label>Downloads</label><input id="f-downloads" type="number" min="0" step="1" value="${x.downloads ?? 0}"></div>
      <div class="field"><label>Featured</label><label class="check"><input id="f-featured" type="checkbox" ${x.featured?"checked":""}> Show featured/star badge</label></div>
      ${field("screenshots","Screenshots","", "One image URL per line", "textarea", (x.screenshots||[]).join("\\n"))}
      ${field("description","Description","", "Markdown supported", "textarea", x.description||"")}
    </div>
    <div id="formError" class="error"></div>
    <div class="toolbar">
      <button class="btn primary" id="saveBtn">Save changes</button>
      <button class="btn" id="duplicateBtn">Duplicate</button>
    </div>
  `;
  $("saveBtn").onclick=saveForm;
  $("duplicateBtn").onclick=duplicateItem;
}

function field(id,label,value="",hint="",kind="input",textareaValue=null){
  const v=textareaValue!==null?textareaValue:(value??"");
  if(kind==="textarea") return `<div class="field full"><label>${label}</label><textarea id="f-${id}" placeholder="${escapeAttr(hint)}">${escapeHtml(v)}</textarea><span class="hint">${escapeHtml(hint)}</span></div>`;
  return `<div class="field"><label>${label}</label><input id="f-${id}" type="${kind}" value="${escapeAttr(v)}" placeholder="${escapeAttr(hint)}"><span class="hint">${escapeHtml(hint)}</span></div>`;
}

function saveForm(){
  const x=items[selected];
  Object.assign(x,{
    id:$("f-id").value.trim(),
    name:$("f-name").value.trim(),
    type:$("f-type").value,
    version:$("f-version").value.trim(),
    updated:$("f-updated").value,
    file:$("f-file").value.trim(),
    size:$("f-size").value.trim(),
    url:$("f-url").value.trim(),
    tagline:$("f-tagline").value.trim(),
    downloads:Number($("f-downloads").value||0),
    featured:$("f-featured").checked,
    screenshots:$("f-screenshots").value.split(/\\r?\\n/).map(s=>s.trim()).filter(Boolean),
    description:$("f-description").value
  });
  const errors=validItem(x);
  if(errors.length){
    $("formError").textContent=errors.join("\\n");
    return;
  }
  $("formError").textContent="";
  renderList();renderEditor();updateRaw();toast("Changes saved locally");
}

function newItem(){
  const today=new Date().toISOString().slice(0,10);
  items.push({
    id:`new-download-${items.length+1}`,name:"New Download",tagline:"",
    type:"other",file:"",size:"",version:"",updated:today,downloads:0,
    featured:false,description:"",screenshots:[],url:"https://"
  });
  selected=items.length-1;
  renderList();renderEditor();updateRaw();
}

function duplicateItem(){
  const copy=JSON.parse(JSON.stringify(items[selected]));
  copy.id=copy.id+"-copy";
  copy.name=copy.name+" Copy";
  items.push(copy);selected=items.length-1;
  renderList();renderEditor();updateRaw();toast("Item duplicated");
}

$("deleteBtn").onclick=()=>{
  if(selected<0)return;
  if(!confirm(`Delete "${items[selected].name}"?`))return;
  items.splice(selected,1);selected=Math.min(selected,items.length-1);
  renderList();renderEditor();updateRaw();toast("Item deleted");
};

function outputData(){
  if(sourceShape==="items") return {...(sourceWrapper||{}),items};
  if(sourceShape==="downloads") return {...(sourceWrapper||{}),downloads:items};
  return items;
}

function updateRaw(){
  $("rawJson").value=JSON.stringify(outputData(),null,2);
}

$("applyRawBtn").onclick=()=>{
  try{
    const parsed=JSON.parse($("rawJson").value);
    const n=normalizeResponse(parsed);
    items=n.items.map(x=>({...x}));
    sourceShape=n.shape;sourceWrapper=n.wrapper;selected=-1;
    renderList();renderEditor();updateRaw();toast(`Applied ${items.length} items`);
  }catch(e){toast("Invalid JSON: "+e.message)}
};

$("exportBtn").onclick=async()=>{
  updateRaw();
  try{await navigator.clipboard.writeText($("rawJson").value);toast("JSON copied to clipboard")}
  catch{toast("Clipboard unavailable — use Download JSON")}
};

$("downloadBtn").onclick=()=>{
  updateRaw();
  const blob=new Blob([$("rawJson").value],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="downloads.json";a.click();
  URL.revokeObjectURL(a.href);
};

$("importBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text());
    const n=normalizeResponse(parsed);
    items=n.items.map(x=>({...x}));sourceShape=n.shape;sourceWrapper=n.wrapper;selected=-1;
    renderList();renderEditor();updateRaw();setStatus(`Imported ${items.length} item${items.length===1?"":"s"} from ${file.name}.`,"ok");
  }catch(err){setStatus("Import failed: "+err.message,"bad")}
  e.target.value="";
};

$("newBtn").onclick=newItem;
$("reloadBtn").onclick=load;
$("search").oninput=renderList;

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#096;")}

load();
</script>
</body>
</html>
