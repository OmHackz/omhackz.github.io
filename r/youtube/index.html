<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heading to YouTube — OmHackz</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/r/redirect.css" />
</head>
<body data-page="redirect" data-target="https://www.youtube.com/@OmHackz">
  <div class="stage" aria-hidden="true">
    <div class="grid-overlay"></div>
    <div class="noise"></div>
  </div>

  <header class="redirect-top">
    <a href="/index.html" class="brand" aria-label="Back home">
      <span class="brand-mark"><img src="/assets/icon.png" alt="OmHackz logo" /></span>
      <span class="brand-text">OmHackz</span>
    </a>
  </header>

  <main id="app">
    <section class="page">
      <div class="glass-card redirect-card reveal">
        <span class="link-icon big"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" /></svg></span>
        <p class="eyebrow">External link</p>
        <h2>Heading to <span class="gradient-text">YouTube</span></h2>
        <p class="handle-line">@OmHackz · videos &amp; builds</p>
        <p class="url-pill">youtube.com/@OmHackz</p>
        <div class="countbar"><span id="countFill"></span></div>
        <p class="count-text">Continuing in <strong id="countNum">5</strong>s — or go now:</p>
        <div class="redirect-actions">
          <a class="btn btn-primary" href="https://www.youtube.com/@OmHackz">Continue to YouTube</a>
          <a class="btn btn-glass" data-stay href="/index.html">Stay here</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/r/redirect.js"></script>
</body>
</html>
